<div class="relative">

  <button
    class="w-9 h-9 rounded-lg border border-prussian-blue-200 flex items-center justify-center text-gray-500 hover:bg-prussian-blue-50 hover:text-prussian-blue-700 transition-all duration-150 hover:scale-105 active:scale-95"
    title="Recherche avancée"
    (click)="toggle()">
    <i class="pi pi-sliders-h text-sm"></i>
  </button>

  <div
    class="absolute right-0 top-full mt-2 w-80 bg-white rounded-xl border border-prussian-blue-100 shadow-lg p-4 origin-top-right transition-all duration-150 z-50"
    [class.opacity-0]="!isOpen()"
    [class.scale-95]="!isOpen()"
    [class.pointer-events-none]="!isOpen()"
    [class.opacity-100]="isOpen()"
    [class.scale-100]="isOpen()">
    <span class="text-xs font-semibold text-gray-600 tracking-wide">RECHERCHE
      AVANCÉE</span>

    <div class="flex flex-col gap-3 mt-3 ">

      <div>
        <p-floatlabel variant="on">
          <input
            pInputText
            [(ngModel)]="keywords"
            variant="outlined"
            autocomplete="off"
            class="w-full px-2.5 py-1.5 rounded-md border border-prussian-blue-200 text-sm focus:outline-none focus:border-prussian-blue-500" />
          <label for="keywords" class="text-xs text-gray-500"> Titre ou contenu
            du document</label>
        </p-floatlabel>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <p-floatlabel variant="on">
          <input
            pInputText
            [(ngModel)]="format"
            variant="outlined"
            autocomplete="off"
            class="w-full px-2.5 py-1.5 rounded-md border border-prussian-blue-200 text-sm focus:outline-none focus:border-prussian-blue-500" />
          <label for="format" class="text-xs text-gray-500"> Format</label>
        </p-floatlabel>
        <p-floatlabel variant="on">
          <input
            pInputText
            [(ngModel)]="language"
            variant="outlined"
            autocomplete="off"
            class="w-full px-2.5 py-1.5 rounded-md border border-prussian-blue-200 text-sm focus:outline-none focus:border-prussian-blue-500" />
          <label for="language" class="text-xs text-gray-500"> Langue</label>
        </p-floatlabel>

      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-xs text-gray-500 mb-1 block">Du</label>
          <input
            type="date"
            [(ngModel)]="startDate"
            class="w-full px-2.5 py-1.5 rounded-md border border-prussian-blue-200 text-sm focus:outline-none focus:border-prussian-blue-500" />
        </div>
        <div>
          <label class="text-xs text-gray-500 mb-1 block">Au</label>
          <input
            type="date"
            [(ngModel)]="endDate"
            [min]="startDate()"
            class="w-full px-2.5 py-1.5 rounded-md border border-prussian-blue-200 text-sm focus:outline-none focus:border-prussian-blue-500" />
        </div>
      </div>

      <label class="flex items-center gap-2 cursor-pointer display-none">
        <input type="checkbox" [defaultValue]="true" [(ngModel)]="fuzzy"
          class="rounded border-prussian-blue-300" />
        <span class="text-sm text-gray-600">Tolère les fautes de
          frappe</span>
      </label>

    </div>

    <div
      class="flex items-center justify-between mt-4 pt-3 border-t border-prussian-blue-100">
      <button
        class="text-xs text-gray-500 hover:text-prussian-blue-700 transition-colors"
        (click)="reset()">
        Réinitialiser
      </button>

      <button
        class="flex items-center gap-2 px-3 py-1.5 rounded-md bg-prussian-blue-700 text-white text-xs font-medium hover:bg-prussian-blue-800 transition-all duration-150 hover:scale-105 active:scale-95 disabled:opacity-60"
        [disabled]="isSearching()"
        (click)="onSearch()">
        @if (isSearching()) {
        <i class="pi pi-spin pi-spinner text-xs"></i>
        } @else {
        <i class="pi pi-search text-xs"></i>
        }
        Rechercher
      </button>
    </div>

  </div>
  <app-dropdown-backdrop [visible]="isOpen()" />

</div>
