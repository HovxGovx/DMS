<div class="relative">

  <button
    class="relative w-9 h-9 rounded-lg border border-prussian-blue-200 flex items-center justify-center text-gray-500 hover:bg-prussian-blue-50 hover:text-prussian-blue-700 transition-colors"
    [class.text-prussian-blue-700]="activeCount() > 0"
    title="Filtres"
    (click)="toggle()">
    <i class="pi pi-sliders-h text-sm"></i>
    @if (activeCount() > 0) {
      <span class="absolute -top-1 -right-1 min-w-4 h-4 px-1 rounded-full bg-burnt-peach-500 text-white text-2xs leading-4 text-center">
        {{ activeCount() }}
      </span>
    }
  </button>

  <div
    class="absolute right-0 top-full mt-2 w-80 bg-white rounded-xl border border-prussian-blue-100 shadow-lg p-4 origin-top-right transition-all duration-150 z-50"
    [class.opacity-0]="!isOpen()"
    [class.scale-95]="!isOpen()"
    [class.pointer-events-none]="!isOpen()"
    [class.opacity-100]="isOpen()"
    [class.scale-100]="isOpen()">
    <span class="text-sm font-semibold text-gray-800">Filtres</span>
    <p class="text-xs text-gray-400 mt-1">Affinent la recherche saisie dans la barre.</p>

    <div class="flex flex-col gap-3 mt-3 ">

      <div class="grid grid-cols-2 gap-2">
        <p-floatlabel variant="on">
          <input
            pInputText
            id="adv-format"
            [(ngModel)]="format"
            variant="outlined"
            autocomplete="off"
            class="w-full px-2.5 py-1.5 rounded-md border border-prussian-blue-200 text-sm focus:outline-none focus:border-prussian-blue-500" />
          <label for="adv-format" class="text-xs text-gray-500"> Format</label>
        </p-floatlabel>
        <p-floatlabel variant="on">
          <input
            pInputText
            id="adv-language"
            [(ngModel)]="language"
            variant="outlined"
            autocomplete="off"
            class="w-full px-2.5 py-1.5 rounded-md border border-prussian-blue-200 text-sm focus:outline-none focus:border-prussian-blue-500" />
          <label for="adv-language" class="text-xs text-gray-500"> Langue</label>
        </p-floatlabel>

      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-xs text-gray-500 mb-1 block">Du</label>
          <input
            type="date"
            [(ngModel)]="startDate"
            class="w-full px-2.5 py-1.5 rounded-md border border-prussian-blue-200 text-sm focus:outline-none focus:border-prussian-blue-500" />
        </div>
        <div>
          <label class="text-xs text-gray-500 mb-1 block">Au</label>
          <input
            type="date"
            [(ngModel)]="endDate"
            [min]="startDate()"
            class="w-full px-2.5 py-1.5 rounded-md border border-prussian-blue-200 text-sm focus:outline-none focus:border-prussian-blue-500" />
        </div>
      </div>

    </div>

    <div
      class="flex items-center justify-between mt-4 pt-3 border-t border-prussian-blue-100">
      <button
        class="text-xs text-gray-500 hover:text-prussian-blue-700 transition-colors"
        (click)="reset()">
        Réinitialiser
      </button>

      <button
        class="flex items-center gap-2 px-3 py-1.5 rounded-md bg-prussian-blue-700 text-white text-xs font-medium hover:bg-prussian-blue-800 transition-colors"
        (click)="onApply()">
        <i class="pi pi-check text-xs"></i>
        Appliquer
      </button>
    </div>

  </div>
  <app-dropdown-backdrop [visible]="isOpen()" />

</div>
