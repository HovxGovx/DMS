<!-- Colonne gauche : sections de l'administration -->
<aside class="w-65 shrink-0 bg-white rounded-xl border border-prussian-blue-100 flex flex-col min-h-0">

  <div class="shrink-0 flex items-center gap-2 px-3 py-2 border-b border-prussian-blue-100">
    <i class="pi pi-cog text-sm text-gray-400"></i>
    <span class="text-xs font-semibold text-gray-600 tracking-wide">ADMINISTRATION</span>
  </div>

  <nav class="flex-1 min-h-0 overflow-y-auto p-2 flex flex-col gap-1 text-xs">
    <button
      class="w-full flex items-center gap-2 px-3 py-2 rounded-md text-left font-medium border-l-[3px] transition-colors"
      [class.border-l-orange-500]="section() === 'users'"
      [class.bg-orange-50]="section() === 'users'"
      [class.text-prussian-blue-800]="section() === 'users'"
      [class.border-l-transparent]="section() !== 'users'"
      [class.text-gray-600]="section() !== 'users'"
      [class.hover:bg-prussian-blue-50]="section() !== 'users'"
      (click)="section.set('users')">
      <i class="pi pi-users text-xs"></i>
      Utilisateurs et domaines
      @if (userState.withoutDomainCount() > 0) {
        <span
          class="ml-auto min-w-4.5 h-4.5 px-1 rounded-full bg-amber-500 text-white text-2xs font-semibold flex items-center justify-center"
          title="Utilisateurs sans domaine">
          {{ userState.withoutDomainCount() }}
        </span>
      }
    </button>

    <button
      class="w-full flex items-center gap-2 px-3 py-2 rounded-md text-left font-medium border-l-[3px] transition-colors"
      [class.border-l-orange-500]="section() === 'failed'"
      [class.bg-orange-50]="section() === 'failed'"
      [class.text-prussian-blue-800]="section() === 'failed'"
      [class.border-l-transparent]="section() !== 'failed'"
      [class.text-gray-600]="section() !== 'failed'"
      [class.hover:bg-prussian-blue-50]="section() !== 'failed'"
      (click)="section.set('failed')">
      <i class="pi pi-exclamation-circle text-xs"></i>
      Documents en échec
      @if (failedState.count() > 0) {
        <span
          class="ml-auto min-w-4.5 h-4.5 px-1 rounded-full bg-red-500 text-white text-2xs font-semibold flex items-center justify-center"
          title="Documents en échec">
          {{ failedState.count() }}
        </span>
      }
    </button>

    <button
      class="w-full flex items-center gap-2 px-3 py-2 rounded-md text-left font-medium border-l-[3px] transition-colors"
      [class.border-l-orange-500]="section() === 'ownerless'"
      [class.bg-orange-50]="section() === 'ownerless'"
      [class.text-prussian-blue-800]="section() === 'ownerless'"
      [class.border-l-transparent]="section() !== 'ownerless'"
      [class.text-gray-600]="section() !== 'ownerless'"
      [class.hover:bg-prussian-blue-50]="section() !== 'ownerless'"
      (click)="section.set('ownerless')">
      <i class="pi pi-user-minus text-xs"></i>
      Sans propriétaire
      @if (ownerlessState.count() > 0) {
        <span
          class="ml-auto min-w-4.5 h-4.5 px-1 rounded-full bg-amber-500 text-white text-2xs font-semibold flex items-center justify-center"
          title="Documents sans propriétaire">
          {{ ownerlessState.count() }}
        </span>
      }
    </button>

    <button
      class="w-full flex items-center gap-2 px-3 py-2 rounded-md text-left font-medium border-l-[3px] transition-colors"
      [class.border-l-orange-500]="section() === 'index'"
      [class.bg-orange-50]="section() === 'index'"
      [class.text-prussian-blue-800]="section() === 'index'"
      [class.border-l-transparent]="section() !== 'index'"
      [class.text-gray-600]="section() !== 'index'"
      [class.hover:bg-prussian-blue-50]="section() !== 'index'"
      (click)="section.set('index')">
      <i class="pi pi-search text-xs"></i>
      Index de recherche
    </button>

    <button
      class="w-full flex items-center gap-2 px-3 py-2 rounded-md text-left font-medium border-l-[3px] transition-colors"
      [class.border-l-orange-500]="section() === 'audit'"
      [class.bg-orange-50]="section() === 'audit'"
      [class.text-prussian-blue-800]="section() === 'audit'"
      [class.border-l-transparent]="section() !== 'audit'"
      [class.text-gray-600]="section() !== 'audit'"
      [class.hover:bg-prussian-blue-50]="section() !== 'audit'"
      (click)="section.set('audit')">
      <i class="pi pi-history text-xs"></i>
      Journal d'audit
    </button>
  </nav>

  <div class="shrink-0 p-2 border-t border-prussian-blue-100">
    <button
      class="w-full flex items-center justify-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium border border-prussian-blue-200 text-prussian-blue-700 hover:bg-prussian-blue-50 transition-colors"
      (click)="onBack()">
      <i class="pi pi-arrow-left text-xs"></i>
      Retour aux documents
    </button>
  </div>
</aside>

<!-- Colonne droite : section ouverte -->
<main class="flex-1 bg-white rounded-xl border border-prussian-blue-100 flex flex-col min-h-0 overflow-hidden">
  @switch (section()) {
    @case ('users') { <app-user-domains-panel /> }
    @case ('failed') { <app-failed-documents-panel /> }
    @case ('ownerless') { <app-ownerless-documents-panel /> }
    @case ('index') { <app-index-rebuild-panel /> }
    @case ('audit') { <app-audit-log-panel /> }
  }
</main>

<app-confirm-dialog />
