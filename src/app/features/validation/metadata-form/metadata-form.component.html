<div class="grid grid-cols-3 gap-4">
  @for (field of fields(); track field.key) {
    <div>
      <label class="text-xs font-semibold text-prussian-blue-600 tracking-wide mb-2 block">
        {{ field.label | uppercase }}
      </label>
      <input
        type="text"
        [ngModel]="field.value"
        (ngModelChange)="updateField(field.key, $event)"
        class="w-full px-3 py-2.5 rounded-lg border border-prussian-blue-200 text-sm text-black focus:outline-none focus:border-prussian-blue-500 focus:ring-2 focus:ring-prussian-blue-100 transition-all"
      />
    </div>
  }
</div>
