<div>
  <label class="text-xs font-semibold text-prussian-blue-400 tracking-wide mb-2 block">
    TAGS SUGGÉRÉS
  </label>

  <div class="flex items-center gap-2 flex-wrap">

    @for (tag of tags(); track tag.label) {
      <div
        class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium border transition-all duration-150"
        [class.bg-emerald-50]="tag.status === 'accepted'"
        [class.border-emerald-200]="tag.status === 'accepted'"
        [class.text-emerald-700]="tag.status === 'accepted'"
        [class.bg-red-50]="tag.status === 'rejected'"
        [class.border-red-200]="tag.status === 'rejected'"
        [class.text-red-600]="tag.status === 'rejected'"
        [class.line-through]="tag.status === 'rejected'"
        [class.bg-prussian-blue-50]="tag.status === 'pending'"
        [class.border-prussian-blue-200]="tag.status === 'pending'"
        [class.text-prussian-blue-700]="tag.status === 'pending'"
      >
        {{ tag.label }}

        @if (tag.status !== 'rejected') {
          <i
            class="pi pi-check text-[10px] cursor-pointer transition-transform hover:scale-125"
            [class.text-emerald-600]="tag.status === 'accepted'"
            [class.text-prussian-blue-300]="tag.status === 'pending'"
            (click)="accept(tag.label)"
          ></i>
        }
        @if (tag.status !== 'accepted') {
          <i
            class="pi pi-times text-[10px] cursor-pointer transition-transform hover:scale-125"
            [class.text-red-500]="tag.status === 'rejected'"
            [class.text-prussian-blue-300]="tag.status === 'pending'"
            (click)="reject(tag.label)"
          ></i>
        }
      </div>
    }

    <!-- Bouton / champ d'ajout -->
    @if (!isAdding()) {
      <button
        class="flex items-center gap-1 px-3 py-1.5 rounded-full text-xs font-medium border border-dashed border-prussian-blue-300 text-prussian-blue-400 hover:bg-prussian-blue-50 hover:border-prussian-blue-400 transition-all duration-150"
        (click)="startAdding()"
      >
        <i class="pi pi-plus text-[10px]"></i>
        Ajouter
      </button>
    } @else {
      <input
        type="text"
        [(ngModel)]="newTagLabel"
        (keyup.enter)="confirmAdd()"
        (keyup.escape)="cancelAdd()"
        (blur)="confirmAdd()"
        placeholder="Nouveau tag..."
        class="px-3 py-1.5 rounded-full text-xs border border-prussian-blue-300 focus:outline-none focus:border-prussian-blue-500 w-32"
        #tagInput
      />
    }

  </div>
</div>
