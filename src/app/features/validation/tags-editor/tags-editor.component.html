<div>
  <label class="text-2xs font-semibold text-gray-500 tracking-wide mb-2 block">
    TAGS SUGGÉRÉS
  </label>

  <div class="flex items-center gap-2 flex-wrap">

    @for (tag of tags(); track tag.id) {
      <div
        class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium border transition-colors"
        [class.bg-emerald-50]="tag.status === 'ACCEPTED'"
        [class.border-emerald-200]="tag.status === 'ACCEPTED'"
        [class.text-emerald-700]="tag.status === 'ACCEPTED'"
        [class.bg-red-50]="tag.status === 'REJECTED'"
        [class.border-red-200]="tag.status === 'REJECTED'"
        [class.text-red-600]="tag.status === 'REJECTED'"
        [class.line-through]="tag.status === 'REJECTED'"
        [class.bg-prussian-blue-50]="tag.status === 'PENDING'"
        [class.border-prussian-blue-200]="tag.status === 'PENDING'"
        [class.text-prussian-blue-700]="tag.status === 'PENDING'"
      >
        {{ tag.label }}

        <!-- Les deux actions restent disponibles pour pouvoir revenir sur un choix -->
        <i
          class="pi pi-check text-2xs cursor-pointer transition-colors hover:text-emerald-600"
          [class.text-emerald-600]="tag.status === 'ACCEPTED'"
          [class.text-gray-400]="tag.status !== 'ACCEPTED'"
          [title]="tag.status === 'ACCEPTED' ? 'Accepté' : 'Accepter'"
          (click)="tag.status !== 'ACCEPTED' && accept(tag)"
        ></i>
        <i
          class="pi pi-times text-2xs cursor-pointer transition-colors hover:text-red-500"
          [class.text-red-500]="tag.status === 'REJECTED'"
          [class.text-gray-400]="tag.status !== 'REJECTED'"
          [title]="tag.status === 'REJECTED' ? 'Rejeté' : 'Rejeter'"
          (click)="tag.status !== 'REJECTED' && reject(tag)"
        ></i>
      </div>
    }

    <!-- Bouton / champ d'ajout -->
    @if (!isAdding()) {
      <button
        class="flex items-center gap-1 px-3 py-1.5 rounded-full text-xs font-medium border border-dashed border-prussian-blue-300 text-prussian-blue-700 hover:bg-prussian-blue-50 hover:border-prussian-blue-400 transition-colors"
        (click)="startAdding()"
      >
        <i class="pi pi-plus text-2xs"></i>
        Ajouter
      </button>
    } @else {
      <input
        type="text"
        [(ngModel)]="newTagLabel"
        (keyup.enter)="confirmAdd()"
        (keyup.escape)="cancelAdd()"
        (blur)="confirmAdd()"
        placeholder="Nouveau tag..."
        class="px-3 py-1.5 rounded-full text-xs border border-prussian-blue-300 focus:outline-none focus:border-prussian-blue-500 w-32"
        #tagInput
      />
    }

  </div>
</div>
