<div>

  <div class="flex items-center justify-between mb-2">
    <label class="text-xs font-semibold text-prussian-blue-400 tracking-wide">
      CLASSEMENT / HIÉRARCHIE
    </label>
    <button
      class="flex items-center gap-1.5 text-xs font-medium text-prussian-blue-600 border border-prussian-blue-300 rounded-full px-3 py-1 hover:bg-prussian-blue-50 transition-colors"
      (click)="toggleEdit()"
    >
      <i class="pi pi-pencil text-[10px]"></i>
      {{ isEditing() ? 'fermer' : 'modifier' }}
    </button>
  </div>

  <div class="flex items-center gap-1 flex-wrap p-2.5 rounded-lg border border-prussian-blue-200 bg-white">
    @for (segment of path(); track segment; let last = $last) {
      <span class="flex items-center gap-1 text-sm text-prussian-blue-700">
        <i class="pi pi-folder text-xs text-prussian-blue-400"></i>
        {{ segment }}
      </span>
      @if (!last) {
        <i class="pi pi-angle-right text-xs text-prussian-blue-300 mx-1"></i>
      }
    }
  </div>

  @if (isEditing()) {
    <div class="mt-2 rounded-lg border border-prussian-blue-100 bg-prussian-blue-50/40 overflow-hidden">

      <div class="flex items-center justify-between px-3 py-2 border-b border-prussian-blue-100">
        <span class="text-xs font-semibold text-prussian-blue-400 tracking-wide">ARBORESCENCE</span>
        <i
          class="pi pi-times text-sm text-prussian-blue-300 cursor-pointer hover:text-prussian-blue-600"
          (click)="close()"
        ></i>
      </div>

      <div class="max-h-56 overflow-y-auto sidebar-tree-scroll p-2">
        <p-tree [value]="treeNodes()" styleClass="!border-none !p-0 !bg-transparent">
          <ng-template let-node pTemplate="default">
            <div
              class="flex items-center justify-between w-full pr-2 py-1 rounded-md cursor-pointer transition-colors"
              [class.bg-prussian-blue-100]="isSelected(node.data.path)"
              [class.hover:bg-prussian-blue-100]="!isSelected(node.data.path)"
              (click)="selectNode(node.data.path)"
            >
              <div class="flex items-center gap-2">
                <i class="pi pi-folder text-sm text-prussian-blue-400"></i>
                <span
                  class="text-sm text-prussian-blue-700"
                  [class.font-semibold]="isSelected(node.data.path)"
                  [class.text-prussian-blue-900]="isSelected(node.data.path)"
                >{{ node.label }}</span>
              </div>
              @if (isSelected(node.data.path)) {
                <i class="pi pi-check text-xs text-prussian-blue-700"></i>
              }
            </div>
          </ng-template>
        </p-tree>
      </div>

    </div>
  }
</div>
