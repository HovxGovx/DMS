<div>

  <div class="flex items-center justify-between mb-2">
    <label class="text-xs font-semibold text-prussian-blue-600 tracking-wide">
      CLASSEMENT
    </label>
    <button
      class="flex items-center gap-1.5 text-xs font-medium text-prussian-blue-600 border border-prussian-blue-300 rounded-full px-3 py-1 hover:bg-prussian-blue-50 transition-colors"
      (click)="toggle()"
    >
      <i class="pi pi-pencil text-[10px]"></i>
      {{ isEditing() ? 'fermer' : 'modifier' }}
    </button>
  </div>

  <div class="p-2.5 rounded-lg border border-prussian-blue-200 bg-white">
    <app-breadcrumb [segments]="path()" />
  </div>

  @if (isEditing()) {
    <div class="mt-2 rounded-lg border border-prussian-blue-100 overflow-hidden">

      <div class="flex items-center justify-between px-3 py-2 border-b border-prussian-blue-100">
        <span class="text-xs font-semibold text-prussian-blue-600 tracking-wide">EXPLORATEUR</span>
        <i
          class="pi pi-times text-sm text-prussian-blue-300 cursor-pointer hover:text-prussian-blue-600"
          (click)="close()"
        ></i>
      </div>

      <div class="max-h-56 overflow-y-auto sidebar-tree-scroll p-2">
        @for (node of tree; track node.key) {
          <app-tree-node
            [node]="node"
            [isExpandedFn]="isExpanded"
            [isActiveFn]="isActive"
            [selectAnyNode]="true"
            (toggleExpand)="onToggleExpand($event)"
            (nodeSelect)="onNodeSelect($event)"
          />
        }
      </div>

    </div>
  }
</div>
