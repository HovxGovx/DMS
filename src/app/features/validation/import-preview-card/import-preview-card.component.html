<div class="flex items-start justify-between gap-6">

  <div class="flex items-start gap-4">
    <!-- Vignette fichier -->
    <div class="w-24 h-28 rounded-lg border border-prussian-blue-100 bg-white shrink-0 flex flex-col overflow-hidden">
      <div class="bg-prussian-blue-900 text-white text-[10px] font-semibold text-center py-1 tracking-wide">
        {{ document().fileFormat }}
      </div>
      <div class="flex-1 flex items-center justify-center">
        <i class="{{ document().fileIcon }} {{ document().fileIconColor }} text-3xl opacity-60"></i>
      </div>
      <div class="px-2 pb-2 flex flex-col gap-1">
        <span class="h-0.5 bg-prussian-blue-100 rounded-full"></span>
        <span class="h-0.5 bg-prussian-blue-100 rounded-full w-3/4"></span>
      </div>
    </div>

    <!-- Infos -->
    <div class="flex flex-col gap-2 pt-1">
      <div class="flex items-center gap-1.5 text-xs font-semibold text-amber-600">
        <i class="pi pi-sparkles text-[11px]"></i>
        SUGGESTIONS IA PRÊTES
      </div>
      <h3 class="text-lg font-semibold text-prussian-blue-900 leading-tight">
        {{ document().fileName }}
      </h3>
      <div class="flex items-center gap-3 text-xs text-prussian-blue-400">
        <span class="flex items-center gap-1">
          <i class="pi pi-database text-[10px]"></i>
          {{ document().fileSize }}
        </span>
        @if (document().pageCount) {
          <span class="flex items-center gap-1">
            <i class="pi pi-book text-[10px]"></i>
            {{ document().pageCount }} pages
          </span>
        }
        <span class="flex items-center gap-1">
          <i class="pi pi-clock text-[10px]"></i>
          Importé il y a 1 min
        </span>
      </div>
    </div>
  </div>

  <!-- Bouton expand -->
  <button class="w-9 h-9 rounded-lg border border-prussian-blue-200 flex items-center justify-center text-prussian-blue-400 hover:bg-prussian-blue-50 hover:text-prussian-blue-700 transition-all duration-150 hover:scale-105 active:scale-95 shrink-0">
    <i class="pi pi-external-link text-sm"></i>
  </button>

</div>
