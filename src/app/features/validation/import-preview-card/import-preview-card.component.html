<div class="flex items-start justify-between gap-3 p-3 pb-1.5">

  <div class="flex items-start gap-4">
    <!-- Vignette fichier -->
    <div class="w-8 h-10 rounded-lg border border-prussian-blue-100 bg-white shrink-0 flex flex-col overflow-hidden">
      <div class="bg-prussian-blue-900 text-white text-[8px] font-semibold text-center py-1 tracking-wide">
        {{ fileType().label }}
      </div>
      <div class="flex-1 flex items-center justify-center">
        <i class="{{ fileType().icon }} {{ fileType().color }} text-3xl opacity-60"></i>
      </div>
      <div class="px-2 pb-2 flex flex-col gap-1">
        <span class="h-px bg-prussian-blue-100 rounded-full w-3/4"></span>
      </div>
    </div>

    <!-- Infos -->
    <div class="flex flex-col gap-2 pt-1">

      <h3 class="text-[14px] font-semibold text-prussian-blue-900 leading-tight">
        {{ document().title }}
      </h3>
      <div class="flex items-center gap-3 text-[10px] text-gray-400">
        <span class="flex items-center gap-1">
          <i class="pi pi-database text-[10px] text-almond-silk-400"></i>
          {{ document().fileSize }}
        </span>
        @if (document().pageCount) {
          <span class="flex items-center gap-1">
            <i class="pi pi-book text-[10px] text-almond-silk-400"></i>
            {{ document().pageCount }} pages
          </span>
        }
        <span class="flex items-center gap-1">
          <i class="pi pi-clock text-[10px] text-almond-silk-400"></i>
          Importé le {{ importedAt() }}
        </span>
      </div>
    </div>
  </div>

  <!-- Bouton expand -->
  <button class="w-9 h-9 rounded-lg border border-prussian-blue-200 flex items-center justify-center text-prussian-blue-400 hover:bg-prussian-blue-50 hover:text-prussian-blue-700 transition-all duration-150 hover:scale-105 active:scale-95 shrink-0">
    <i class="pi pi-external-link text-sm"></i>
  </button>

</div>
