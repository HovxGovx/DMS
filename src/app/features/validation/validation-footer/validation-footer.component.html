<div class="flex flex-col gap-1.5 p-1.5 border-t border-prussian-blue-100">
  @if (blocker(); as reason) {
    <span class="text-xs text-amber-700 flex items-center gap-1 px-1">
      <i class="pi pi-info-circle text-2xs shrink-0"></i>
      <span class="truncate">{{ reason }}</span>
    </span>
  }

  <div class="flex items-center justify-between gap-3">
    <div class="flex items-center gap-3 min-w-0">
      <button
        class="flex items-center gap-1.5 text-sm text-gray-500 hover:text-prussian-blue-700 transition-colors disabled:opacity-40 disabled:hover:text-gray-500 disabled:cursor-not-allowed"
        [disabled]="resetDisabled()"
        title="Annuler mes modifications du titre, du domaine et du type"
        (click)="resetClick.emit()"
      >
        <i class="pi pi-undo text-sm"></i>
        Annuler les modifications
      </button>

      <button
        class="flex items-center gap-1.5 text-sm text-gray-500 hover:text-red-600 transition-colors disabled:opacity-40 disabled:hover:text-gray-500 disabled:cursor-not-allowed"
        [disabled]="deleteDisabled()"
        title="Supprimer le document"
        (click)="deleteClick.emit()"
      >
        <i class="pi pi-trash text-sm"></i>
        Supprimer
      </button>

      <span class="text-xs text-gray-400 whitespace-nowrap">
        {{ remainingCount() }} restant{{ remainingCount() > 1 ? 's' : '' }}
      </span>
    </div>

    <p-button
      label="Publier"
      icon="pi pi-send"
      [loading]="isPublishing()"
      title="Publier (Ctrl+Entrée)"
      styleClass="!bg-prussian-blue-700 !border-prussian-blue-700 hover:!bg-prussian-blue-800 transition-colors"
      (click)="publishClick.emit()"
      [disabled]="publishDisabled()"
    />
  </div>
</div>
