<p-floatlabel variant="on">
  <p-select
    [options]="options()"
    optionLabel="label"
    optionValue="value"
    [(ngModel)]="value"
    [class.p-inputwrapper-filled]="!!value()"
    [disabled]="disabled()"
    [fluid]="true"
    appendTo="body"
    panelStyleClass="!text-sm" />
  <label>{{ label() }} <span class="text-burnt-peach-500">*</span></label>
</p-floatlabel>
