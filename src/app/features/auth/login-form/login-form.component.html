<div class="h-full flex flex-col justify-center px-14 max-w-md mx-auto">

  <span class="text-xs font-semibold text-prussian-blue-500 tracking-wide mb-2">
    ACCÈS SÉCURISÉ À L'ESPACE DE TRAVAIL
  </span>

  <h1 class="text-xl font-bold text-prussian-blue-900 mb-6">Connectez-vous à votre compte</h1>


  <form class="flex flex-col gap-5" (ngSubmit)="onSubmit()">

    <div>
      <label class="text-sm font-medium text-prussian-blue-900 mb-1.5 block">E-mail ou nom d'utilisateur</label>
      <p-iconfield class="w-full">
        <p-inputicon class="pi pi-envelope" />
        <input pInputText type="text" [(ngModel)]="uid" name="uid"
               placeholder="nom@entreprise.com" class="w-full !bg-prussian-blue-50 !border-prussian-blue-100 transition-all duration-150 active:scale-[1.02] active:scale-95" />
      </p-iconfield>
    </div>

    <div>
      <label class="text-sm font-medium text-prussian-blue-900 mb-1.5 block">Mot de passe</label>
      <p-iconfield class="w-full">
        <p-inputicon class="pi pi-lock" />
        <input pInputText type="password" [(ngModel)]="password" name="password"
               placeholder="Entrez votre mot de passe" !required class="w-full !bg-prussian-blue-50 !border-prussian-blue-100 transition-all duration-150 active:scale-[1.02] active:scale-95" />
      </p-iconfield>
    </div>
<!--
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <p-checkbox [(ngModel)]="rememberMe" name="rememberMe" [binary]="true" inputId="remember" />
        <label for="remember" class="text-sm text-prussian-blue-600 cursor-pointer">Se souvenir de moi</label>
      </div>
      <a class=" text-sm text-prussian-blue-600 font-medium hover:text-prussian-blue-800 cursor-pointer">
        Mot de passe oublié ?
      </a>
    </div> -->
    @if (errorMessage()) {
      <p class="text-xs text-red-500 flex items-center gap-1.5">
        <i class="pi pi-exclamation-circle text-[10px]"></i>
        {{ errorMessage() }}
      </p>
    }
    <button
      type="submit"
      class="flex items-center justify-center gap-2 w-full py-3 rounded-lg bg-rusty-spice-500 text-white text-sm font-semibold hover:bg-rusty-spice-600 transition-all duration-150 hover:scale-[1.02] active:scale-95 cursor-pointer"
    >
      {{ isLoading() ? 'Connexion...' : 'Se connecter' }}
      @if (!isLoading()) {
        <i class="pi pi-arrow-right text-xs"></i>
      }
    </button>

  </form>

</div>
