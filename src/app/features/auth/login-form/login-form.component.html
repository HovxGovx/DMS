<div class="h-full flex flex-col justify-center px-14 max-w-md mx-auto">

  <h1 class="text-xl font-bold text-gray-800 mb-6">Connectez-vous à votre compte</h1>

  <form class="flex flex-col gap-5" (ngSubmit)="onSubmit()">

    <div>
      <label for="login-uid" class="text-sm font-medium text-gray-800 mb-1.5 block">Nom d'utilisateur</label>
      <p-iconfield class="w-full">
        <p-inputicon class="pi pi-user" />
        <input pInputText id="login-uid" type="text" [(ngModel)]="uid" name="uid" required
               autocomplete="username" autofocus
               placeholder="Identifiant de votre compte" class="w-full !bg-prussian-blue-50 !border-prussian-blue-100" />
      </p-iconfield>
    </div>

    <div>
      <label for="login-password" class="text-sm font-medium text-gray-800 mb-1.5 block">Mot de passe</label>
      <p-iconfield class="w-full">
        <p-inputicon class="pi pi-lock" />
        <input pInputText id="login-password" type="password" [(ngModel)]="password" name="password" required
               autocomplete="current-password"
               placeholder="Entrez votre mot de passe" class="w-full !bg-prussian-blue-50 !border-prussian-blue-100" />
      </p-iconfield>
    </div>

    @if (errorMessage()) {
      <p class="text-xs text-red-500 flex items-center gap-1.5" role="alert">
        <i class="pi pi-exclamation-circle text-2xs"></i>
        {{ errorMessage() }}
      </p>
    }
    <button
      type="submit"
      class="flex items-center justify-center gap-2 w-full py-3 rounded-md bg-burnt-peach-500 text-white text-sm font-semibold hover:bg-burnt-peach-600 transition-colors cursor-pointer disabled:opacity-60 disabled:cursor-wait"
      [disabled]="isLoading()"
    >
      @if (isLoading()) {
        <i class="pi pi-spin pi-spinner text-xs"></i>
        Connexion…
      } @else {
        Se connecter
        <i class="pi pi-arrow-right text-xs"></i>
      }
    </button>

  </form>

</div>
