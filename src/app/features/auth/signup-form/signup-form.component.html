<div class="h-full flex flex-col justify-center px-16 max-w-md mx-auto">

  <span class="text-xs font-semibold text-prussian-blue-500 tracking-wide mb-2">
    DEMANDE D'ACCÈS À L'ESPACE DE TRAVAIL
  </span>

  <h1 class="text-3xl font-bold text-prussian-blue-900 mb-2">Créez votre compte</h1>
  <p class="text-sm text-prussian-blue-400 mb-8">
    Configurez votre profil pour rejoindre l'espace documentaire de votre organisation.
  </p>

  <form class="flex flex-col gap-5" (ngSubmit)="onSubmit()">

    <div>
      <label class="text-sm font-medium text-prussian-blue-900 mb-1.5 block">Nom complet</label>
      <p-iconfield class="w-full">
        <p-inputicon class="pi pi-user !text-prussian-blue-300" />
        <input pInputText type="text" [(ngModel)]="fullName" name="fullName"
               placeholder="Alex Morgan" class="w-full !bg-prussian-blue-50 !border-prussian-blue-100" />
      </p-iconfield>
    </div>

    <div>
      <label class="text-sm font-medium text-prussian-blue-900 mb-1.5 block">E-mail professionnel</label>
      <p-iconfield class="w-full">
        <p-inputicon class="pi pi-envelope !text-prussian-blue-300" />
        <input pInputText type="text" [(ngModel)]="email" name="email"
               placeholder="nom@entreprise.com" class="w-full !bg-prussian-blue-50 !border-prussian-blue-100" />
      </p-iconfield>
    </div>

    <div>
      <label class="text-sm font-medium text-prussian-blue-900 mb-1.5 block">Mot de passe</label>
      <p-iconfield class="w-full">
        <p-inputicon class="pi pi-lock !text-prussian-blue-300" />
        <input pInputText type="password" [(ngModel)]="password" name="password"
               placeholder="8 caractères minimum" class="w-full !bg-prussian-blue-50 !border-prussian-blue-100" />
      </p-iconfield>
    </div>

    <div>
      <label class="text-sm font-medium text-prussian-blue-900 mb-1.5 block">Confirmer le mot de passe</label>
      <p-iconfield class="w-full">
        <p-inputicon class="pi pi-check !text-prussian-blue-300" />
        <input pInputText type="password" [(ngModel)]="confirmPassword" name="confirmPassword"
               placeholder="Répétez votre mot de passe" class="w-full !bg-prussian-blue-50 !border-prussian-blue-100" />
      </p-iconfield>
    </div>

    <button
      type="submit"
      class="flex items-center justify-center gap-2 w-full py-3 rounded-lg bg-rusty-spice-500 text-white text-sm font-semibold hover:bg-rusty-spice-600 transition-all duration-150 hover:scale-[1.02] active:scale-95"
    >
      Créer le compte
      <i class="pi pi-arrow-right text-xs"></i>
    </button>

  </form>

</div>
