<div class="h-screen w-full flex flex-col bg-prussian-blue-950">

  <div class="shrink-0 h-12 flex items-center justify-between px-4 bg-white border-b border-prussian-blue-100">
    <button
      class="flex items-center gap-2 text-sm text-prussian-blue-600 hover:text-prussian-blue-900 transition-colors"
      (click)="goBack()"
    >
      <i class="pi pi-arrow-left text-xs"></i>
      Retour à DocuFlow
    </button>
  </div>

  <div class="flex-1 min-h-0 relative">

    @if (isLoading()) {
      <div class="absolute inset-0 flex items-center justify-center bg-white">
        <div class="flex flex-col items-center gap-3">
          <i class="pi pi-spin pi-spinner text-2xl text-prussian-blue-400"></i>
          <span class="text-sm text-prussian-blue-400">Chargement de l'éditeur...</span>
        </div>
      </div>
    }

    @if (loadError()) {
      <div class="absolute inset-0 flex items-center justify-center bg-white">
        <div class="flex flex-col items-center gap-3 text-center px-4">
          <i class="pi pi-exclamation-triangle text-2xl text-red-400"></i>
          <span class="text-sm text-red-500">{{ loadError() }}</span>
        </div>
      </div>
    }

    <div #editorContainer id="documentEditorPlaceholder" class="w-full h-full"></div>

  </div>

</div>
