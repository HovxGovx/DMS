<div
  class=" w-full  group flex items-center justify-between gap-3 p-2  rounded-xl border-2 border-dashed transition-colors  duration-150 cursor-pointer "
  [class.border-prussian-blue-200]="!isDragOver() && !isUploading()"
  [class.bg-white]="!isDragOver() && !isUploading()"
  [class.hover:border-prussian-blue-400]="!isDragOver() && !isUploading()"
  [class.hover:bg-prussian-blue-50]="!isDragOver() && !isUploading()"
  [class.border-prussian-blue-500]="isDragOver()"
  [class.bg-prussian-blue-50]="isDragOver() || isUploading()"
  [class.pointer-events-none]="isUploading()"
  [class.opacity-70]="isUploading()"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
  role="button"
  tabindex="0"
  aria-label="Importer des fichiers"
  (click)="fileInput.click()"
  (keydown.enter)="fileInput.click()"
  (keydown.space)="$event.preventDefault(); fileInput.click()">
  <input
    #fileInput
    type="file"
    multiple
    [accept]="acceptedExtensions"
    class="hidden"
    (change)="onFileSelect($event)" />

  <div class="flex items-center gap-4">
    <div class="w-7 flex items-center justify-center shrink-0">
      @if (isUploading()) {
      <i class="pi pi-spin pi-spinner text-prussian-blue-600 text-xl"></i>
      } @else {
      <i class="pi pi-cloud-upload text-prussian-blue-600 text-xl"></i>
      }
    </div>

    <div>
      <div class="text-2xs text-gray-800">
        @if (isUploading()) {
        <span class="font-semibold text-xs">Import en cours...</span>
        } @else {
        <span class="font-semibold text-xs">Déposez les fichiers</span>
        <span class="text-gray-500 ml-1">ou cliquez pour parcourir — PDF, Word, Excel,
          PowerPoint, OpenDocument, RTF · {{ maxFileSizeMb }} Mo max par fichier</span>
        }
      </div>
    </div>
  </div>
</div>
