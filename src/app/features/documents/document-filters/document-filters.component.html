<div class="flex items-center gap-3 flex-wrap">

  <!-- Filtre date -->
  <button
    class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium border border-prussian-blue-200 text-prussian-blue-700 hover:bg-prussian-blue-50 transition-all duration-150 hover:scale-105 active:scale-95"
    (click)="dateClick.emit()"
  >
    <span class="text-gray-400 font-semibold">DATE:</span>
    {{ dateLabel() }}
    <i class="pi pi-angle-down text-[10px] text-prussian-blue-400"></i>
  </button>

  <span class="w-px h-4 bg-prussian-blue-100"></span>

  <span class="text-xs font-semibold text-gray-400">TAGS:</span>

  <!-- Chips de tags -->
  @for (tag of tagOptions(); track tag.label) {
    <button
      class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium border transition-all duration-150 hover:scale-105 active:scale-95"
      [class]="isActive(tag.label)
        ? tag.borderColor + ' ' + tag.bgActive + ' ' + tag.textColor
        : 'border-prussian-blue-200 text-gray-600 hover:bg-prussian-blue-50'"
      (click)="toggleTag(tag.label)"
    >
      <span class="w-1.5 h-1.5 rounded-full" [class]="tag.dotColor"></span>
      {{ tag.label }}
    </button>
  }

</div>
