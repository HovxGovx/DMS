
  <p-table
  [value]="documents()"
  [(selection)]="selectedDocs"
  [scrollable]="true"
  scrollHeight="flex"
  dataKey="id"
  class="flex-1 min-h-0 flex flex-col"
  styleClass="!text-xs h-full doc-table-scroll">
    <ng-template pTemplate="header" class="!pb-1">
      <tr class="p-0">
        <th class="!text-xs   !text-gray-400 !font-semibold !tracking-wide !bg-prussian-blue-50">Nom Fichier</th>
        <th class="!text-xs  !text-gray-400 !font-semibold !tracking-wide !bg-prussian-blue-50">Tags</th>
        <th class="!text-xs  !text-gray-400 !font-semibold !tracking-wide !bg-prussian-blue-50">Modification</th>
        <th class="!text-xs  !text-gray-400 !font-semibold !tracking-wide !bg-prussian-blue-50">Action</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-doc>
      <tr
        class="hover:bg-prussian-blue-50/50 transition-colors duration-150 cursor-pointer"
        (click)="rowClick.emit(doc.id)"
      >

        <td>
          <div class="flex items-center gap-2">
            <i class="{{ doc.icon }} {{ doc.iconColor }}"></i>
            <span class="font-medium text-prussian-blue-900">{{ doc.name }}</span>
            @if (doc.locked) {
              <i class="pi pi-lock text-xs text-amber-500"></i>
            }
          </div>
        </td>
        <td>
          <div class="flex gap-1.5 flex-wrap">
            <p-tag [value]="doc.category" [severity]="doc.categorySeverity" styleClass="!text-xs !font-medium" />
            @for (tag of doc.tags; track tag.label) {
              <p-tag [value]="tag.label" [severity]="tag.severity" styleClass="!text-xs !font-medium" />
            }
          </div>
        </td>
        <td>
          <div class="flex items-center gap-1.5 text-gray-400">
            <span class="w-1.5 h-1.5 rounded-full {{ doc.modifiedDotColor }}"></span>
            {{ doc.modified }}
          </div>
        </td>
        <td (click)="$event.stopPropagation()">
          <div class="flex items-center gap-1">
            <button
              class="w-7 h-7 rounded-md flex items-center justify-center text-prussian-blue-300 hover:bg-prussian-blue-100 hover:text-prussian-blue-700 transition-all duration-150 hover:scale-105 active:scale-95"
              title="Ouvrir le fichier"
              (click)="openFile.emit(doc.id)"
            >
              <i class="pi pi-eye text-xs"></i>
            </button>
            <button
              class="w-7 h-7 rounded-md flex items-center justify-center text-prussian-blue-300 hover:bg-prussian-blue-100 hover:text-prussian-blue-700 transition-all duration-150 hover:scale-105 active:scale-95"
              title="Modifier les métadonnées"
              (click)="editMetadata.emit(doc.id)"
            >
              <i class="pi pi-pencil text-xs"></i>
            </button>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
