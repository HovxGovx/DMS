<div class="flex flex-col gap-3">
  <div class="flex items-center gap-3">
    <i class="{{ icon() }} {{ iconColor() }} text-lg"></i>
    <div>
      <div class="text-base font-semibold text-gray-800 leading-tight">{{ name() }}</div>
    </div>
  </div>

  <div class="flex gap-1.5 flex-wrap">
    @for (tag of tags(); track $index) {
      <p-tag [value]="tag.label" [severity]="tag.severity" styleClass="!text-xs !font-medium" />
    }
  </div>
</div>
