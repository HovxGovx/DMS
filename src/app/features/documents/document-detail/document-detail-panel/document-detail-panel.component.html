<!-- Header fixe -->
<div class=" w-full shrink-0 flex items-center justify-between p-2.5 border-b border-prussian-blue-100">
  <span class="text-xs font-semibold text-gray-600 tracking-wide">DÉTAILS DU DOCUMENT</span>
  <i class="pi pi-external-link text-sm text-gray-400 cursor-pointer hover:text-prussian-blue-600"></i>
</div>

<!-- Corps scrollable -->
<div class="flex-1 min-h-0 overflow-y-auto scroll-smooth sidebar-tree-scroll p-1.5 flex flex-col gap-4">

  <app-document-info-card
    [name]="document().name"
    [id]="document().docId"
    [icon]="document().icon"
    [iconColor]="document().iconColor"
    [tags]="document().tags"
  />

  @if (document().location.length) {
  <hr class="border-prussian-blue-100" />

  <div>
    <h4 class="text-[11px] font-semibold text-gray-500 tracking-wide mb-1.5">EMPLACEMENT</h4>
    <div class="flex items-center gap-1 flex-wrap text-xs text-gray-700">
      @for (segment of document().location; track $index; let last = $last) {
      <span [class.font-semibold]="last">{{ segment }}</span>
      @if (!last) {
      <i class="pi pi-angle-right text-[10px] text-gray-300"></i>
      }
      }
    </div>
    <button
      class="mt-1.5 flex items-center gap-1.5 text-xs text-prussian-blue-600 hover:text-prussian-blue-700 transition-colors"
      (click)="revealInFolder()">
      <i class="pi pi-folder-open text-[11px]"></i>
      Afficher dans son dossier
    </button>
  </div>
  }

  @if (document().systemMetadata.length) {
  <hr class="border-prussian-blue-100" />

  <app-document-metadata-section title="MÉTADONNÉES SYSTÈME" [items]="document().systemMetadata" />
  }

  @if (document().businessMetadata.length) {
  <hr class="border-prussian-blue-100" />

  <app-document-metadata-section title="MÉTADONNÉES MÉTIER" [items]="document().businessMetadata" />
  }

</div>

<div
  class="w-full shrink-0 p-2 border-t border-prussian-blue-100 flex items-center justify-between text-xs text-gray-500">
  <span>Ceci est le footer</span>
  <span class="font-mono">Footer</span>
</div>
