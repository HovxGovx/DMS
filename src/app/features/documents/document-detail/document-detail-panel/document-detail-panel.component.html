<!-- Header fixe -->
<div class="shrink-0 flex items-center justify-between pb-3 mb-4 border-b border-prussian-blue-100">
  <span class="text-xs font-semibold text-prussian-blue-400 tracking-wide">DÉTAILS DU DOCUMENT</span>
  <i class="pi pi-ellipsis-h text-sm text-prussian-blue-300 cursor-pointer hover:text-prussian-blue-600"></i>
</div>

<!-- Corps scrollable -->
<div class="flex-1 min-h-0 overflow-y-auto scroll-smooth sidebar-tree-scroll pr-1 flex flex-col gap-4">

  <app-document-info-card
    [name]="document().name"
    [docId]="document().docId"
    [icon]="document().icon"
    [iconColor]="document().iconColor"
    [tags]="document().tags"
  />

  <hr class="border-prussian-blue-100" />

  <app-document-metadata-section title="MÉTADONNÉES SYSTÈME" [items]="document().systemMetadata" />

  <hr class="border-prussian-blue-100" />

  <app-document-metadata-section title="MÉTADONNÉES MÉTIER" [items]="document().businessMetadata" />

  <hr class="border-prussian-blue-100" />

  <div>
    <h4 class="flex items-center gap-1.5 text-xs font-semibold text-prussian-blue-400 tracking-wide mb-2">
      <i class="pi pi-sparkles text-[11px]"></i>
      RÉSUMÉ AUTO (IA)
    </h4>
    <p class="text-sm text-prussian-blue-700 leading-relaxed">{{ document().aiSummary }}</p>
  </div>

</div>
