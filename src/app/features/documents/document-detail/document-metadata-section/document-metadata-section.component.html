<div>
  <h4 class="text-xs font-semibold text-prussian-blue-400 tracking-wide mb-3">{{ title() }}</h4>
  <div class="flex flex-col gap-3">
    @for (item of items(); track item.label) {
      <div class="flex items-center justify-between text-sm">
        <span class="text-prussian-blue-400">{{ item.label }}</span>
        <span class="flex items-center gap-1.5 text-prussian-blue-900 font-mono text-xs">
          @if (item.dotColor) {
            <span class="w-1.5 h-1.5 rounded-full {{ item.dotColor }}"></span>
          }
          {{ item.value }}
        </span>
      </div>
    }
  </div>
</div>
