<div class="h-screen bg-prussian-blue-50/30 flex flex-col overflow-hidden">

  <app-topbar />

  <div class="p-1 flex flex-col gap-2 flex-1 min-h-0">

    <IngestPanel />

    <div class="flex gap-1 flex-1 min-h-0">

      <!-- Sidebar gauche -->
      <aside class="w-65 shrink-0 bg-white rounded-xl border border-prussian-blue-100 flex flex-col min-h-0">
        <app-sidebar />
      </aside>

      <!-- Zone de contenu principale -->
      <main class="flex-1 bg-white rounded-xl border border-prussian-blue-100 p-0 overflow-y-auto">
        <router-outlet />
      </main>

      <!-- Panel droit : Filters -->

      <!-- shell.component.html, remplace l'aside droit -->
      <aside class="w-90 shrink-0 bg-white rounded-xl border border-prussian-blue-100 p-4 flex flex-col min-h-0">
        <app-document-detail-panel [document]="selectedDocument" />
      </aside>

    </div>

  </div>

</div>
