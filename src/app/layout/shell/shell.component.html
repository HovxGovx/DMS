<div class="h-screen bg-prussian-blue-50/30 flex flex-col overflow-hidden">

  <app-topbar />

  <div class="p-4 flex flex-col gap-3 flex-1 min-h-0">

    <IngestPanel />

    @switch (currentView()) {
      @case ('documents') {
        <div class="flex gap-3 flex-1 min-h-0">
          <aside class="w-72 shrink-0 bg-white rounded-xl border border-prussian-blue-100 p-4 flex flex-col min-h-0">
            <app-sidebar />
          </aside>

          <main class="flex-1 bg-white rounded-xl border border-prussian-blue-100 p-4 overflow-y-auto">
            <router-outlet />
          </main>

          <aside class="w-72 shrink-0 bg-white rounded-xl border border-prussian-blue-100 p-4 flex flex-col min-h-0">
            <app-document-detail-panel [document]="selectedDocument" />
          </aside>
        </div>
      }

      @case ('validation') {
        <app-validation-view />
      }
    }

  </div>

</div>
