<div class="w-full shrink-0 p-3  border-b border-prussian-blue-100">
  <div class="flex items-center justify-between mb-3">
    <span
      class="text-xs font-semibold text-gray-400 tracking-wide">EXPLORATEUR</span>
    <div class="flex items-center gap-2 text-gray-300">
      <i
        class="pi pi-folder-plus text-xs  hover:text-prussian-blue-600"></i>
    </div>
  </div>
  <p-iconfield>
    <i class="pi pi-search absolute left-3 top-1/2 -translate-y-1/2 text-black text-xs text-bold"></i>
    <input
      pInputText
      type="text"
      placeholder="\client\project\invoices"
      class="w-full !text-xs !py-2 !bg-prussian-blue-50 !border-prussian-blue-100 font-mono" />
  </p-iconfield>

</div>

<div
  class="flex-1 min-h-0 overflow-y-auto scroll-smooth sidebar-tree-scroll pr-1">
  @for (node of hierarchyTree; track node.key) {
  <app-tree-node [node]="node" />
  }
</div>

<div
  class="w-full shrink-0 p-2 border-t border-prussian-blue-100 flex items-center justify-between text-xs text-gray-400">
  <span>{{ totalDocs }} · {{ totalSize }}</span>
  <span class="font-mono">{{ version }}</span>
</div>
