<div class="flex items-center justify-between px-2 pt-1 mb-2">
  <span class="text-sm font-semibold text-gray-800">Explorateur</span>
  <div class="flex items-center gap-1">
    <button
      class="flex items-center gap-1 text-xs font-medium text-prussian-blue-600 hover:text-prussian-blue-800 transition-colors"
      title="Nouveau dossier"
      (click)="openCreateAtRoot()">
      <i class="pi pi-folder-plus text-2xs"></i>
      Nouveau dossier
    </button>
    <button
      class="w-7 h-7 rounded-md flex items-center justify-center text-gray-400 hover:bg-prussian-blue-100 hover:text-prussian-blue-700 transition-colors"
      title="Replier le panneau"
      (click)="layout.toggleLeft()">
      <i class="pi pi-angle-double-left text-sm"></i>
    </button>
  </div>
</div>

<div
  class="flex-1 min-h-0 overflow-y-auto scroll-smooth sidebar-tree-scroll pr-1">
  @if (state.treeError()) {
  <p class="text-xs text-red-500 text-center py-4">{{ state.treeError() }}</p>
  } @else {
  @for (node of state.tree(); track node.key) {
  <app-tree-node
    [node]="node"
    [isExpandedFn]="isExpanded"
    [isActiveFn]="isActive"
    [selectAnyNode]="true"
    [actionsEnabled]="true"
    (nodeAction)="onNodeAction($event)"
    (toggleExpand)="onToggleExpand($event)"
    (nodeSelect)="onNodeSelect($event)" />
  }
  @if (showMyImports()) {
  <div class="mt-1 pt-1 border-t border-prussian-blue-100">
    <app-tree-node
      [node]="myImportsNode()"
      [isExpandedFn]="isExpanded"
      [isActiveFn]="isActive"
      [selectAnyNode]="true"
      (nodeSelect)="onNodeSelect($event)" />
  </div>
  }
  }
</div>

<!-- Périmètre de l'utilisateur : les dossiers ne montrent que les documents de ces domaines -->
<div
  class="w-full shrink-0 px-2.5 py-2 border-t border-prussian-blue-100 flex items-center gap-1.5 text-xs text-gray-500 min-w-0"
  [title]="domainsLabel()">
  <i class="pi pi-sitemap text-xs shrink-0"></i>
  <span class="truncate">{{ domainsLabel() }}</span>
</div>

@if (editor(); as ed) {
  <app-folder-editor-dialog
    [mode]="ed.mode"
    [folderId]="ed.folderId"
    [parentId]="ed.parentId"
    (saved)="onEditorSaved($event)"
    (closed)="editor.set(null)" />
}
