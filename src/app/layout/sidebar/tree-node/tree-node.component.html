<div
  class="group flex items-center gap-2 py-1.5 pr-2 rounded-md cursor-pointer transition-colors duration-150"
  [style.paddingLeft.px]="depth() * 14 + 8"
  [class.bg-prussian-blue-100]="isActive"
  [class.hover:bg-prussian-blue-50]="!isActive"
  (click)="onRowClick()"
>
  @if (node().hasChildren ?? !!node().children?.length) {
    <i
      class="pi text-[10px] text-prussian-blue-300 shrink-0"
      [class.pi-chevron-down]="isExpanded"
      [class.pi-chevron-right]="!isExpanded"
      (click)="onChevronClick($event)"
    ></i>
  } @else {
    <span class="w-2.5 shrink-0"></span>
  }

  <i
    class="{{ node().icon }} text-sm shrink-0"
    [class.text-prussian-blue-700]="isActive"
    [class.text-prussian-blue-400]="!isActive"
  ></i>

  <span
    class="text-sm flex-1 truncate"
    [class.font-semibold]="isActive"
    [class.text-prussian-blue-900]="isActive"
    [class.text-prussian-blue-700]="!isActive"
  >{{ node().label }}</span>
  @if (actionsEnabled()) {
    <span class="flex items-center gap-1.5 shrink-0 opacity-0 group-hover:opacity-100 transition-opacity">
      <i
        class="pi pi-plus text-[10px] text-prussian-blue-300 hover:text-prussian-blue-700"
        title="Nouveau sous-dossier"
        (click)="onAction($event, 'create')"
      ></i>
      @if (node().editable) {
        <i
          class="pi pi-pencil text-[10px] text-prussian-blue-300 hover:text-prussian-blue-700"
          title="Modifier"
          (click)="onAction($event, 'edit')"
        ></i>
        <i
          class="pi pi-trash text-[10px] text-prussian-blue-300 hover:text-red-500"
          title="Supprimer"
          (click)="onAction($event, 'delete')"
        ></i>
      }
    </span>
  }
  @if (count !== null) {
    <span
      class="text-xs px-1.5 py-0.5 rounded"
      [class.bg-prussian-blue-200]="isActive"
      [class.text-prussian-blue-700]="isActive"
      [class.text-prussian-blue-300]="!isActive"
    >{{ count }}</span>
  }
</div>

@if (node().children?.length && isExpanded) {
  <div class="ml-3 pl-2 border-l border-prussian-blue-100">
    @for (child of node().children; track child.key) {
      <app-tree-node
        [node]="child"
        [depth]="depth() + 1"
        [isExpandedFn]="isExpandedFn()"
        [isActiveFn]="isActiveFn()"
        [getCountFn]="getCountFn()"
        [selectAnyNode]="selectAnyNode()"
        [actionsEnabled]="actionsEnabled()"
        (nodeAction)="nodeAction.emit($event)"
        (toggleExpand)="toggleExpand.emit($event)"
        (nodeSelect)="nodeSelect.emit($event)"
      />
    }
  </div>
}
