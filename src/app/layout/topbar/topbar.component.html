<header class="h-12 flex items-center justify-between px-6 bg-white border-b border-prussian-blue-100">

  <!-- Logo + titre -->
  <div class="flex items-center gap-3">
    <!-- Logo de l'entreprise (public/assets, servi à la racine), séparé du logo de l'application -->
    <img src="assets/logo-unima.jpg" alt="UNIMA" class="h-10 w-auto">
    <div class="w-px h-7 bg-prussian-blue-100"></div>
    <div class="w-9 h-9 rounded-lg bg-prussian-blue-800 flex items-center justify-center">
      <i class="pi pi-file-import text-white text-lg"></i>
    </div>
    <div class="leading-tight">
      <div class="font-semibold text-gray-800 text-sm">E-Lamina</div>
      <div class="text-xs text-gray-500 tracking-wide"></div>
    </div>
  </div>

  <!-- La recherche ne porte que sur les documents publiés : masquée pendant la publication -->
  @if (viewState.currentView() === 'documents') {
  <app-search-dropdown />
  } @else {
  <div class="flex-1 max-w-xl mx-8"></div>
  }
  <!-- Changement de vue : documents ou publication -->
  <app-view-toggle />
  <!-- Profil utilisateur -->
  <app-user-menu />

</header>
