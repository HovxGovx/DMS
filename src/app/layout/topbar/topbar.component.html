<header class="h-12 flex items-center justify-between px-6 bg-white border-b border-prussian-blue-100">

  <!-- Logo + titre -->
  <div class="flex items-center gap-3">
    <div class="w-9 h-9 rounded-lg bg-prussian-blue-800 flex items-center justify-center">
      <i class="pi pi-file text-white text-lg"></i>
    </div>
    <div class="leading-tight">
      <div class="font-semibold text-prussian-blue-900 text-xs">DocuFlow</div>
      <div class="text-xs text-prussian-blue-400 tracking-wide">ENTERPRISE DMS</div>
    </div>
  </div>

  <!-- Breadcrumbs -->
  <div class="flex-1 flex items-center px-6 overflow-hidden">
    <nav class="flex items-center gap-1 text-xs text-prussian-blue-400 font-medium overflow-x-auto no-scrollbar whitespace-nowrap">
      @for (step of hierarchyState.currentPath(); track $index) {
        <span class="hover:text-prussian-blue-800 cursor-pointer transition-colors">
          {{ step }}
        </span>
        @if (!$last) {
          <i class="pi pi-chevron-right text-[10px] mx-1 opacity-50"></i>
        }
      }
    </nav>
  </div>

  <app-search-dropdown />
  <app-advanced-search-panel />
  <app-view-toggle />
  <app-user-menu />

</header>
