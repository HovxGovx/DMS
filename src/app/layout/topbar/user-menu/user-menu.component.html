<div class="relative">

  <button
    type="button"
    class="flex items-center gap-2 cursor-pointer select-none rounded-md"
    [title]="userName()"
    aria-haspopup="menu"
    [attr.aria-expanded]="isOpen()"
    (click)="toggle()">
    <span class="w-8 h-8 rounded-full bg-prussian-blue-700 text-white flex items-center justify-center text-xs font-semibold shrink-0">
      {{ userInitials() }}
    </span>
    <i
      class="pi pi-chevron-down text-xs text-prussian-blue-300 ml-1 transition-transform duration-200"
      [class.rotate-180]="isOpen()"
    ></i>
  </button>

  <app-dropdown-backdrop [visible]="isOpen()" />

  <div
    class="absolute right-0 top-full mt-2 w-60 bg-white rounded-xl border border-prussian-blue-100 shadow-lg py-1.5 origin-top-right transition-all duration-150 z-50"
    [class.opacity-0]="!isOpen()"
    [class.scale-95]="!isOpen()"
    [class.pointer-events-none]="!isOpen()"
    [class.opacity-100]="isOpen()"
    [class.scale-100]="isOpen()"
    [attr.inert]="isOpen() ? null : ''"
  >

    <!-- Compte connecté -->
    <div class="px-3.5 pt-1 pb-1.5 min-w-0">
      <div class="text-sm font-semibold text-gray-800 truncate">{{ userName() }}</div>
      <div class="text-xs text-gray-500 truncate">{{ userUid() }} · {{ userRole() }}</div>
    </div>

    <hr class="my-1.5 border-prussian-blue-100" />

    @if (authService.hasRole('ADMIN')) {
    <button
      class="w-full text-left px-3.5 py-2 text-sm text-prussian-blue-800 hover:bg-prussian-blue-50 flex items-center gap-2.5 transition-colors"
      [class.font-semibold]="viewState.currentView() === 'admin'"
      (click)="openAdministration()"
    >
      <i class="pi pi-cog text-xs"></i>
      Administration
    </button>

    <hr class="my-1.5 border-prussian-blue-100" />
    }

    <button
      class="w-full text-left px-3.5 py-2 text-sm text-red-600 hover:bg-red-50 flex items-center gap-2.5 transition-colors"
      (click)="logout()"
    >
      <i class="pi pi-sign-out text-xs"></i>
      Déconnexion
    </button>
  </div>

</div>
