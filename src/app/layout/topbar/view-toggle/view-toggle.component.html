<div class="flex items-center p-0.5 rounded-lg bg-prussian-blue-50 border border-prussian-blue-100">

  <button
    class="flex items-center gap-1.5 px-3 py-1.5 rounded-md text-[8px] font-medium transition-all duration-150"
    [class.bg-white]="viewState.currentView() === 'documents'"
    [class.shadow-sm]="viewState.currentView() === 'documents'"
    [class.text-prussian-blue-900]="viewState.currentView() === 'documents'"
    [class.text-prussian-blue-400]="viewState.currentView() !== 'documents'"
    (click)="viewState.setView('documents')"
  >
    <i class="pi pi-folder text-xs"></i>

  </button>

  <button
    class="relative flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-medium transition-all duration-150"
    [class.bg-white]="viewState.currentView() === 'validation'"
    [class.shadow-sm]="viewState.currentView() === 'validation'"
    [class.text-prussian-blue-900]="viewState.currentView() === 'validation'"
    [class.text-prussian-blue-400]="viewState.currentView() !== 'validation'"
    (click)="viewState.setView('validation')"
  >
    <i class="pi pi-inbox text-xs"></i>

    @if (validationState.remainingCount() > 0) {
      <span class="ml-0.5 min-w-4.5 h-4.5 px-1 rounded-full bg-orange-500 text-white text-[10px] font-semibold flex items-center justify-center">
        {{ validationState.remainingCount() }}
      </span>
    }
  </button>

</div>
