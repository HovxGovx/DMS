server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fallback SPA : toute route inconnue renvoie index.html,
    # pour que le routing Angular (client-side) prenne le relais
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Relais des appels API vers le backend — même rôle que le proxy Angular en dev,
    # le nom "backend" doit correspondre au nom du service dans docker-compose.yml
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    location /auth/ {
        proxy_pass http://backend:8080/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    location /me {
        proxy_pass http://backend:8080/me;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    # Cache long pour les assets statiques compilés (JS/CSS avec hash dans le nom)
    location ~* \.(?:js|css|woff2?|svg|png|jpg)$ {
        expires 30d;
        access_log off;
    }
}