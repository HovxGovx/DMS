server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Taille max d'une requête d'import : alignée sur max-request-size du backend et sur upload-limits.ts
    client_max_body_size 250M;

    # Fallback SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy vers le backend (^~ = prioritaire sur le bloc regex du cache)
    location ^~ /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location ^~ /auth/ {
        proxy_pass http://backend:8080/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /me {
        proxy_pass http://backend:8080/me;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html toujours revalidé (304 si inchangé) : sinon le navigateur garde l'ancien
    # et continue de charger les fichiers compilés de la construction précédente
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Cache long seulement pour les fichiers compilés dont le nom porte l'empreinte du build (main-RTL5GVM4.js)
    location ~* "-[a-z0-9]{8}\.(?:js|css)$" {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Images, polices et favicon gardent leur nom d'une version à l'autre : revalidés à chaque chargement
    location ~* \.(?:woff2?|svg|png|jpg|ico)$ {
        add_header Cache-Control "no-cache";
        access_log off;
    }
}